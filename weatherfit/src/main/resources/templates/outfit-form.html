
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>외출 정보 입력 - WeatherFit</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background: #f8f7f4;
            color: #292724;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 25px;
        }

        header {
            border-bottom: 1px solid #eae7e1;
        }

        nav {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: #a58b70;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            font-size: 14px;
            color: #77716a;
        }

        .nav-links a:hover {
            color: #a58b70;
        }

        .page-heading {
            text-align: center;
            padding: 65px 0 35px;
        }

        .eyebrow {
            color: #a58b70;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 13px;
        }

        h1 {
            font-size: 35px;
            letter-spacing: -1.5px;
            margin-bottom: 12px;
        }

        h1 span {
            color: #a58b70;
        }

        .page-heading p:last-child {
            color: #89827a;
            font-size: 14px;
        }

        .form-section {
            background: white;
            border: 1px solid #eeeae4;
            border-radius: 18px;
            padding: 40px;
            margin-bottom: 70px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.025);
        }

        .form-group {
            margin-bottom: 27px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #e5e0d8;
            border-radius: 8px;
            background: #fff;
            color: #39342e;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #a58b70;
        }

        .time-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .help-text {
            display: block;
            margin-top: 8px;
            color: #999189;
            font-size: 12px;
        }

        .activity-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .activity-option {
            position: relative;
        }

        .activity-option input {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
        }

        .activity-option label {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 65px;
            padding: 12px;
            border: 1px solid #e5e0d8;
            border-radius: 9px;
            background: #fff;
            color: #77716a;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .activity-option input:checked + label {
            background: #f3eee8;
            border-color: #a58b70;
            color: #80684f;
            font-weight: 700;
        }

        .activity-option input:focus-visible + label {
            outline: 2px solid #a58b70;
            outline-offset: 3px;
        }

        .submit-button {
            width: 100%;
            height: 53px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #38332e;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-button:hover {
            background: #a58b70;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #89827a;
            font-size: 13px;
        }

        footer {
            border-top: 1px solid #eae7e1;
            padding: 28px 0;
            text-align: center;
            color: #aaa39b;
            font-size: 12px;
        }

        @media (max-width: 650px) {
            .container {
                padding: 0 18px;
            }

            nav {
                height: 65px;
            }

            .nav-links {
                gap: 12px;
                font-size: 12px;
            }

            .page-heading {
                padding: 45px 0 30px;
            }

            h1 {
                font-size: 28px;
            }

            .form-section {
                padding: 25px 20px;
            }

            .time-group {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .activity-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <a th:href="@{/}" class="logo">
                    Weather<span>Fit</span>
                </a>

                <div class="nav-links">
                    <a th:href="@{/}">홈</a>
                    <a th:href="@{/clothes}">나의 옷장</a>
                    <a th:href="@{/outfit/form}">AI 코디 추천</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">

        <section class="page-heading">
            <p class="eyebrow">YOUR PERSONAL AI STYLIST</p>

            <h1>
                오늘의 <span>외출 정보</span>를 알려주세요.
            </h1>

            <p>
                외출 시간대의 날씨를 분석해 가장 잘 어울리는 코디를 추천해 드립니다.
            </p>
        </section>

        <section class="form-section">
			<!-- 입력 성공 메시지 -->
			<div th:if="${submitted}"
			     style="background: #f3eee8; padding: 18px; border-radius: 8px; margin-bottom: 25px; color: #80684f;">

			    <strong>외출 정보가 정상적으로 전달되었습니다!</strong>

			    <p style="margin-top: 10px; font-size: 13px;">
			        날짜: <span th:text="${outingDate}"></span><br>
			        외출 시간: <span th:text="${startTime}"></span><br>
			        귀가 시간: <span th:text="${endTime}"></span><br>
			        활동 유형: <span th:text="${activityType}"></span>
			    </p>
			</div>

			<!-- 오류 메시지 -->
			<div th:if="${errorMessage}"
			     style="background: #fbeeee; padding: 15px; border-radius: 8px; margin-bottom: 25px; color: #a94442;"
			     th:text="${errorMessage}">
			</div>

            <form th:action="@{/outfit/recommend}" method="post">

                <div class="form-group">
                    <label for="outingDate">외출 날짜</label>

                    <input
                        type="date"
                        id="outingDate"
                        name="outingDate"
                        required>

                    <span class="help-text">
                        코디 추천을 받고 싶은 날짜를 선택해 주세요.
                    </span>
                </div>

                <div class="time-group">

                    <div class="form-group">
                        <label for="startTime">외출 시간</label>

                        <input
                            type="time"
                            id="startTime"
                            name="startTime"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="endTime">귀가 예정 시간</label>

                        <input
                            type="time"
                            id="endTime"
                            name="endTime"
                            required>
                    </div>

                </div>

                <div class="form-group">
                    <label>주요 활동 유형</label>

                    <div class="activity-options">

                        <div class="activity-option">
                            <input
                                type="radio"
                                id="indoor"
                                name="activityType"
                                value="실내 활동 위주"
                                required>

                            <label for="indoor">
                                실내 활동 위주
                            </label>
                        </div>

                        <div class="activity-option">
                            <input
                                type="radio"
                                id="outdoor"
                                name="activityType"
                                value="실외 활동 위주">

                            <label for="outdoor">
                                실외 활동 위주
                            </label>
                        </div>

                        <div class="activity-option">
                            <input
                                type="radio"
                                id="mixed"
                                name="activityType"
                                value="실내외 활동 반반">

                            <label for="mixed">
                                실내외 활동 반반
                            </label>
                        </div>

                    </div>
                </div>

                <button type="submit" class="submit-button">
                    AI 코디 추천받기
                </button>

            </form>

            <a th:href="@{/}" class="back-link">
                ← 홈으로 돌아가기
            </a>

        </section>

    </main>

    <footer>
        <div class="container">
            WeatherFit © 2026. Dress for the weather, style your day.
        </div>
    </footer>

    <script>

		// 오늘부터 16일 이내의 날짜만 선택할 수 있도록 설정
		const today = new Date();

		const localToday = new Date(
		    today.getTime() - today.getTimezoneOffset() * 60000
		).toISOString().split("T")[0];

		const dateInput = document.getElementById("outingDate");

		// 오늘 날짜
		dateInput.min = localToday;

		// 15일 뒤까지 선택 가능 (오늘 포함 총 16일)
		const maxDate = new Date(today);
		maxDate.setDate(maxDate.getDate() + 15);

		const localMaxDate = new Date(
		    maxDate.getTime() - maxDate.getTimezoneOffset() * 60000
		).toISOString().split("T")[0];

		dateInput.max = localMaxDate;
		dateInput.value = localToday;


        // 귀가 시간이 외출 시간보다 빠르거나 같은 경우 제출 방지
        document.querySelector("form").addEventListener("submit", function(event) {
            const startTime = document.getElementById("startTime").value;
            const endTime = document.getElementById("endTime").value;

            if (startTime >= endTime) {
                event.preventDefault();
                alert("귀가 예정 시간은 외출 시간보다 늦게 설정해 주세요.");
            }
        });
    </script>

</body>
</html>
